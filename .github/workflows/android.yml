name: Android
on:
  push:
    branches: [gtheday]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Compilar e testar
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Assinar e verificar o APK
        run: bash scripts/sign_android.sh
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validar APK instalado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/smoke_android.py dist/GtheDay.apk
      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-android
          path: |
            evidence/
            app/build/test-results/testReleaseUnitTest/
      - name: Guardar cópia criptografada da chave
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: assinatura-criptografada
          path: dist/assinatura.cms
      - name: Publicar APK validado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'A versão 1.0.0 já foi publicada.'
            exit 0
          fi
          gh release create v1.0.0 --target "$GITHUB_SHA" --title 'GtheDay 1.0.0' \
            --notes 'APK assinado e testado em um emulador Android. Instale o GtheDay.apk e permita as notificações quando quiser começar a receber lembretes.' \
            dist/GtheDay.apk dist/GtheDay.apk.sha256
